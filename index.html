<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z'/><path d='M3 6h18'/><path d='M16 10a4 4 0 0 1-8 0'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#059669" />
    <meta
      name="description"
      content="DealScout aggregates hyper-local grocery circulars, normalizes package unit costs, and flags cross-store savings."
    />
    
    <!-- PWA & Mobile Web Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DealScout" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>DealScout - Grocery Circulars & Unit Price Matcher</title>

    <script>
      // Instantly unregister any stale dev service workers and clear caches in preview
      (function() {
        var isDevHost = location.hostname === 'localhost' || 
                        location.hostname === '127.0.0.1' || 
                        location.hostname.indexOf('ais-dev') !== -1 ||
                        location.hostname.indexOf('run.app') !== -1;
        if (isDevHost && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function() {});
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            }).catch(function() {});
          }
        }

        // Global early error handler to replace blank screen with recovery UI if React fails to mount
        window.addEventListener('error', function(e) {
          var root = document.getElementById('root');
          if (root && (!root.children.length || root.innerHTML.indexOf('data-rendered') === -1)) {
            var msg = e && e.message ? e.message : 'Application initialization error';
            console.error('[DealScout Early Boot Error]:', e);
            var errContainer = document.getElementById('ds-boot-error');
            if (!errContainer) {
              root.innerHTML = '<div id="ds-boot-error" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:sans-serif;background:#f8fafc;">' +
                '<div style="max-width:420px;width:100%;background:#fff;border-radius:16px;padding:24px;border:1px solid #e2e8f0;text-align:center;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);">' +
                '<div style="width:44px;height:44px;border-radius:50%;background:#fee2e2;color:#dc2626;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:22px;">!</div>' +
                '<h2 style="font-size:18px;font-weight:700;color:#0f172a;margin:0 0 8px 0;">DealScout Starting Up</h2>' +
                '<p style="font-size:13px;color:#64748b;margin:0 0 16px 0;line-height:1.5;">Click below to reload the application shell.</p>' +
                '<button onclick="window.location.reload()" style="cursor:pointer;padding:10px 20px;background:#059669;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;">Reload App</button>' +
                '</div></div>';
            }
          }
        });
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-100 selection:text-emerald-900 min-h-screen">
    <div id="root">
      <!-- Fast initial placeholder prevents white flash while bundle parses -->
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="text-align: center; max-width: 320px; padding: 24px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #059669, #0f766e); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          </div>
          <h1 style="font-size: 19px; font-weight: 800; color: #0f172a; margin: 0 0 4px 0; letter-spacing: -0.02em;">Deal<span style="color: #059669;">Scout</span></h1>
          <p style="font-size: 12px; color: #64748b; margin: 0 0 16px 0;">Loading local grocery circulars...</p>
          <div style="width: 22px; height: 22px; border: 2.5px solid #059669; border-top-color: transparent; border-radius: 50%; margin: 0 auto; animation: ds-spin 0.8s linear infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes ds-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
