<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#059669" />
    <meta
      name="description"
      content="Hyper-local weekly grocery circular aggregator and comparative shopping platform. Normalizes unit prices ($/lb, $/oz, $/egg) across physical supermarkets and flags competitor deal swaps."
    />
    <meta property="og:title" content="DealScout" />
    <meta property="og:description" content="Hyper-local weekly grocery circular aggregator and comparative shopping platform. Normalizes unit prices ($/lb, $/oz, $/egg) across physical supermarkets and flags competitor deal swaps." />
    
    <!-- iOS Home Screen Icon & Web App Capability -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DealScout" />

    <!-- Favicon / Desktop Browser Icon -->
    <link rel="icon" type="image/jpeg" sizes="192x192" href="/icon-192.jpg" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      html, body, #root {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }
    </style>
    <title>DealScout - Grocery Circulars & Unit Price Matcher</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-100 selection:text-emerald-900 min-h-screen">
    <div id="root">
      <!-- Fast initial placeholder prevents white flash while bundle parses -->
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="text-align: center; max-width: 320px; padding: 24px;">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #059669, #0f766e); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          </div>
          <h1 style="font-size: 19px; font-weight: 800; color: #0f172a; margin: 0 0 4px 0; letter-spacing: -0.02em;">Deal<span style="color: #059669;">Scout</span></h1>
          <p style="font-size: 12px; color: #64748b; margin: 0 0 16px 0;">Loading local grocery circulars...</p>
          <div style="width: 22px; height: 22px; border: 2.5px solid #059669; border-top-color: transparent; border-radius: 50%; margin: 0 auto; animation: ds-spin 0.8s linear infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes ds-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
